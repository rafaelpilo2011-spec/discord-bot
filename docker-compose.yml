version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: discord-bot-db
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_pass
      POSTGRES_DB: discord_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: discord-bot
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: "postgresql://discord_bot:discord_bot_pass@db:5432/discord_bot?schema=public"
      PREFIX: "!"
      LOG_LEVEL: "info"
    restart: unless-stopped

volumes:
  postgres_data:
